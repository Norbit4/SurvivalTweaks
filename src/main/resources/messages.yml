# Reload: /survivaltweaks reload, permission: survivaltweaks.command

reload-message: '<green>Plugin has been reloaded!'

dead-messages:
  prefix: '<#9e9e9e>[{DEATH}<white><bold>☠</bold><#9e9e9e>] <#ee6535>{PLAYER}'
  messages:
    drowning: '{PREFIX} <#e5dbd8>drowing!'
    suffocation: '{PREFIX} <#e5dbd8>suffocated in a wall!'
    fall: '{PREFIX} <#e5dbd8>fell from a high place!'
    lava: '{PREFIX} <#e5dbd8>fell into a pit of lava!'
    fire: '{PREFIX} <#e5dbd8>burned to death!'
    fire-tick: '{PREFIX} <#e5dbd8>walked into fire!'
    void: '{PREFIX} <#e5dbd8>fell out of the world!'
    lightning: '{PREFIX} <#e5dbd8>was struck by lightning!'
    entity-attack: '{PREFIX} <#e5dbd8>was slain by {ENTITY}!'
    entity-explosion: '{PREFIX} <#e5dbd8>was blown up by {ENTITY}!'
    projectile: '{PREFIX} <#e5dbd8>was shot by {ENTITY}!'
    magic: '{PREFIX} <#e5dbd8>was killed with magic by {ENTITY}!'
    wither: '{PREFIX} <#e5dbd8>withered away!'
    starvation: '{PREFIX} <#e5dbd8>starved to death!'
    poison: '{PREFIX} <#e5dbd8>was poisoned!'
    thorns: '{PREFIX} <#e5dbd8>was killed by thorns!'
    dragon: '{PREFIX} <#e5dbd8>was killed by the ender dragon!'
    hot-floor: '{PREFIX} <#e5dbd8>discovered the floor was lava!'
    other: '{PREFIX} <#e5dbd8>died!'

# {ENTITY} - display entity name
# {HEALTH} - display entity health
# {DISTANCE} - display distance from entity
spyglass:
  display: '<#dcee9a> {ENTITY} [{HEALTH}<red><red>❤<#dcee9a>] {DISTANCE}m'

# {TIME} - display time
clock:
  display: '<gray>Time: <#d786f3>{TIME}'

# {X} - display X cord
# {Y} - display Y cord
# {Z} - display Z cord
# {BIOME} - display biome name
# {WORLD} - display world name
compass:
  display: '<gray>X: <#dcee9a>{X} <gray>Y: <#dcee9a>{Y} <gray>Z: <#dcee9a>{Z}<#7ed323> [{BIOME}]'
  messages:
    track-usage: '<gray>Usage: /track <x, z>'
    only-player: '<red>Only player can use this command!'
    invalid-material: '<red>You must be holding a compass to use this command!'
    invalid-number: '<red>Invalid number format!'
    track-success: '<gray>Tracking location: <#a6e194>{X}, {Z}'
    track-item: '<white>Tracking Compass <gray>[<#a6e194>{X}, {Z}<gray>]'

# {X} - display X cord
# {Y} - display Y cord
# {Z} - display Z cord
# {WORLD} - display world name
recovery-compass:
  display: '<white><bold>☠</bold>  <gray>X: <red>{X} <gray>Y: <red>{Y} <gray>Z: <red>{Z}'
  display-no-death-location: '<white><bold>☠</bold> <gray>You have not died yet!'

# {ENTITY} - display entity name
# {HEALTH} - display entity health
entity-hp:
  display: '<#decfa6>{ENTITY} <#df5252>{HEALTH}❤'

# {TIME} - display time
villager-profession-cooldown:
  message: '<white>Changing a villagers profession is possible for <red>{TIME}.'
  time:
    minutes: 'minutes'
    seconds: 'seconds'

block-bone-meal:
  messages: '<red>You can not use bonemeal here!'

keep-items:
  messages:
    title: '<red><bold>☠</bold> You died!'
    subtitle: '<gray>You kept <green>50% <gray>items!'

infinity-food:
  cooldown: '<red>Cooldown: {cooldown}'
block-spawn-egg-change:
  message: '<red>You cannot change the spawner type using a spawn egg!'
block-spawn-near-spawner:
  message: '<red>You cannot place a spawner this close to another spawner!'

global:
  no-permission: '<red>You do not have permission to use this command.'
  cooldown: '<red>You must wait <yellow>{time}s <red>before using this command again.'

item-signature:
  usage: '<red>Usage: /signature <name>'
  permission: 'survivaltweaks.sign'
  success: '<green>Item signed successfully!'
  error: '<red>You must hold an item in your hand!'
  lore:
    - ' <italic:false><#f5e898>{player} <dark_gray>({date})'

enchantment-extraction:
  book-lore: '<red>Chance of failure: 50%'

