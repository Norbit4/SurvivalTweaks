# Item identifier.
# Supports vanilla Minecraft materials and custom items.
#
# Formats:
# - <material>               (Vanilla Minecraft)
# - nexo:<id>                (Nexo)
# - ia:<id>                  (ItemsAdder)
# - mmoitems:<category>:<id> (MMOItems)
# - oraxen:<id>              (Oraxen)
# - ce:<id>                  (CraftEngine)
# - mm:<id>                  (MythicMobs)
#
# Examples:
# - STONE
# - DIAMOND_SWORD
# - nexo:ruby
# - ia:magic_ingot
# - mmoitems:SWORD:LONG_SWORD
# - oraxen:amethyst_hammer
# - ce:topaz
# - mm:BanditTunic

mechanics:
  # Displays the player's coordinates while holding a compass.
  compass:
    enabled: true
  # Displays the current world time while holding a clock.
  clock:
    enabled: true
  # Displays the player's last death location while holding a recovery compass.
  recovery-compass:
    enabled: true
  # Displays the targeted entity's health and distance while using a spyglass.
  spyglass:
    enabled: true
    cooldown: 3
  # Allows players to change their size by eating specific items.
  # Custom items can also be used to trigger the size change.
  # Use the item format shown above to define the required custom item.
  #
  # Small size:
  # - Reduced health
  # - Smaller hitbox
  #
  # Big size:
  # - Increased health
  # - Higher jump
  # - Larger hitbox
  # - Double food consumption
  size:
    enabled: true
    small: GLOW_BERRIES
    normal: GOLDEN_CARROT
    big: SWEET_BERRIES
  # Grants Dolphin's Grace while wearing a turtle helmet underwater.
  turtle-helmet:
    enabled: true
    # 30% chance to reduce helmet durability by 1 every 2 seconds while underwater.
    durability: true
  # Launches a fireball when right-clicking with a Fire Charge.
  fireball:
    enabled: true
    cooldown: 40
    # Explosion power. Higher values create larger explosions.
    yield: 2
  # Makes players drop their head on death.
  player-head:
    enabled: true
    # Prevents farming player heads through repeated kills.
    anti-abuse: true
    # Chance for the head to drop. 1.0 = 100%.
    chance: 0.2
  # Allows Totems of Undying to activate when dying in the void.
  # Applies Levitation to help the player escape.
  void-totem:
    enabled: true
  # Allows players to mine spawners using Silk Touch or configured tools.
  mine-spawners:
    enabled: true
    # If enabled, player-placed spawners always drop.
    always-drop-placed-by-players: true
    failure-drop:
      enabled: true
      # Item dropped when spawner mining fails.
      # This happens if:
      # - the wrong tool is used,
      # - Silk Touch is required but missing,
      # - the drop chance check fails.
      item: 'IRON_INGOT'
      amount: 1
    types:
      normal:
        silk-touch: true
        chance: 0.9
        # Custom items can be used in the same format as above.
        tools:
          - 'DIAMOND_PICKAXE'
        worlds:
          - 'world'
      nether:
        silk-touch: true
        chance: 0.9
        tools:
          - 'NETHERITE_PICKAXE'
        worlds:
          - 'world_nether'

  # Allows budding amethyst blocks to be mined with Silk Touch.
  mine-budding-amethyst:
    enabled: true
  # Displays the targeted entity's health in the action bar.
  entity-hp:
    enabled: true
  # Blaze killed by water have a chance to drop Blaze Rods (50% chance - 1 rod, 10% chance - 2 rods)
  # Vanilla Minecraft does not drop Blaze Rods in this case.
  blaze-water-drop:
    enabled: true
  # Prevents villagers from changing professions too quickly.
  villager-profession-cooldown:
    enabled: false
    # Cooldown time in seconds
    cooldown: 90
  # Allows players to hide or reveal item frames with Shift + Right Click.
  invisible-item-frames:
    enabled: true
  # Keeps 50% of the player's inventory after death.
  keep-items:
    enabled: false
    # Worlds where keep-items are disabled
    disabled-worlds:
      - 'example_world'
    # ItemsAdder - ia:<id> Nexo - nexo:<id>
    always-keep:
      - 'example_item'
  mace-nerf:
    enabled: true
    # Reduces mace damage by a percentage.
    # Example: 60 = damage is reduced by 60%, so only 40% remains.
    # If the original damage is 20, the final damage will be 8.
    # Final damage is also capped by mace MaxDamage.
    percentage: 40
    # Maximum damage that a mace hit can deal after all calculations (prevents extremely high smash damage)
    max-damage: 35
    disabled-worlds:
      - 'example_world'

  spear-nerf:
    enabled: true
    # Reduces spear damage by a percentage.
    # Example: 60 = damage is reduced by 60%, so only 40% remains.
    # If the original damage is 20, the final damage will be 8.
    # Final damage is also capped by spear MaxDamage.
    percentage: 40
    # Maximum damage a spear hit can deal
    max-damage: 35
    # Spear with lunge cooldown (in ticks)
    cooldown: 60
    disabled-worlds:
      - 'example_world'

  # Increases Happy Ghast health and movement speed.
  happy-ghost-boost:
    enabled: true
    speed-multiplier: 1.5
    hp: 100
  # Removes the "Too Expensive!" limit in anvils.
  # Replaces it with the maximum possible level cost (39).
  anvil-too-expensive-fix:
    enabled: true
  # Custom death messages and statistics.
  dead-messages:
    enabled: true
    # Prevents abuse by repeatedly dying in a short period of time.
    # When a player is blocked by the anti-abuse system:
    # - death messages are not displayed,
    # - death statistics are not increased,
    anti-abuse: true
    # Worlds where death messages and death/kill statistics are disabled.
    disabled-worlds:
      - 'example_world'
  # Protects against grief caused by explosions.
  # Includes TNT, End Crystals, Respawn Anchors and TNT Minecarts.
  grief-protection:
    enabled: false
    block-tnt-explosion: true
    block-crystal-explosion: true
    block-anchor-explosion: true
    block-tnt-minecart: true
  # Overrides furnace fuel values.
  # Fuel values are configured in furnace.yml.
  furnace-fuel-nerf:
    enabled: false
  # Restricts Wither spawning to the Nether.
  nether-wither:
    enabled: false
  # Allows dispensers with shears to harvest Sweet Berry and Glow Berry bushes.
  dispenser-berry-harvest:
    enabled: true
  # Prevents mobs spawned from spawners from dropping equipped armor and weapons.
  disable-equipment-drops-from-spawner-mobs:
    enabled: false
  # Infinite food system.
  # Listed items are returned to the player's hand after being consumed instead of being used up.
  # Each item has its own cooldown before it can be consumed again.
  infinity-food:
    enabled: false
    items:
      white_monster:
        # use only the ID, without 'nexo:' or 'ia:' etc.
        id: 'white_monster'
        cooldown: 30
      golden_apple:
        id: 'GOLDEN_APPLE'
        cooldown: 15
  # Allows extracting a random enchantment from an item using a grindstone.
  # The required item is consumed on each extraction attempt.
  enchantment-extraction:
    enabled: true
    success-chance: 0.5
    # Custom items can be used in the same format as above.
    required-item: "LAPIS_LAZULI"
  # This overrides Minecraft default waypoint attributes
  # (waypoint_receive_range and waypoint_transmit_range).
  #
  # Note: After changing this option and reloading the plugin,
  # players must rejoin the server for the new values to be applied.
  waypoints:
    enabled: false
    # Maximum waypoint range in blocks.
    range: 60
  # Random names for villagers assigned on natural spawn
  villagers-random-names:
    enabled: true
    color: '&#9c4321'
    names:
      - 'Oliver'
      - 'Jack'
      - 'Henry'
      - 'Thomas'
      - 'William'
      - 'Emily'
      - 'Sophia'
      - 'Charlotte'
      - 'Amelia'
      - 'Grace'
      - 'Anna'
      - 'Rose'
      - 'Evelyn'
      - 'Alice'
      - 'Clara'
      - 'Farmer Joe'
      - 'Old Tom'
      - 'Billy'
      - 'Greg'
      - 'Bob'
      - 'Harold'
      - 'Larry'
      - 'Steve'
      - 'Alex'
      - 'Notch'
  # Random names for dogs assigned when tamed
  dogs-random-names:
    enabled: true
    color: '&#dff2f0'
    names:
      - 'Buddy'
      - 'Max'
      - 'Rocky'
      - 'Charlie'
      - 'Cooper'
  # Random names for cats assigned when tamed
  cats-random-names:
    enabled: true
    color: '&#dff2f0'
    names:
      - 'Luna'
      - 'Milo'
      - 'Simba'
      - 'Nala'
      - 'Shadow'