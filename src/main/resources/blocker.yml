blocker:
  # Adds a cooldown after brushing an armadillo.
  armadillo-brush-cooldown:
    enabled: false
    # Cooldown in seconds.
    cooldown: 30
  # Despawns Ender Pearls after 20 seconds.
  # Prevents long-distance teleports using frozen Ender Pearls.
  ender-pearl-despawn:
    enabled: false

  # Prevents changing spawner types using spawn eggs.
  # Bypass permission: survivaltweaks.spawner-use.bypass
  block-spawn-egg-change:
    enabled: false
  # Prevents placing a spawner too close to another spawner.
  # Bypass permission: survivaltweaks.spawner.bypass
  block-place-spawner-near-spawner:
    enabled: false
    # Minimum distance between spawners in blocks.
    distance: 3

  elytra:
    # Prevents Elytra from generating in End Cities.
    block-generate: false
    # Prevents applying the Mending enchantment to Elytra.
    block-mending: false
  # Prevents selected items from generating in loot chests.
  block-loot:
    enabled: false
    items:
    - 'NETHERITE_UPGRADE_SMITHING_TEMPLATE'
  # Prevents using bone meal on selected blocks.
  # Bypass permission: survivaltweaks.bonemeal.bypass
  block-bone-meal:
    enabled: false
    # If enabled, dispensers will be unable to use bone meal on any block.
    block-dispenser: true
    # List of blocks/crops affected by this restriction.
    blocked:
      - 'CARROTS'
      - 'POTATOES'
      - 'WHEAT'
      - 'BEETROOTS'
      - 'MELON'
      - 'PUMPKIN'
      - 'COCOA'
      - 'BAMBOO'
      - 'KELP'
      - 'MELON_STEM'
      - 'PUMPKIN_STEM'
      - 'CAVE_VINES'
      - 'SWEET_BERRY_BUSH'
      - 'BAMBOO_SAPLING'
      - 'GLOW_BERRIES'
      - 'CAVE_VINES_PLANT'
